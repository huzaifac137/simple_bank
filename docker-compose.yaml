version: "3.9"
services:
  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=qwerty7867
      - POSTGRES_DB=simple_bank_db
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_SOURCE=postgresql://postgres:qwerty7867@postgres:5432/simple_bank_db?sslmode=disable
    depends_on: 
       postgres:
         condition: service_healthy

    

